<div class="auth-container">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p>Join SwiftDo and start organizing your tasks</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="username">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="email@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>

      <div *ngIf="errorMessage" class="error-text">{{ errorMessage }}</div>

      <button type="submit" [disabled]="registerForm.invalid" class="btn-primary">
        Register
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Login here</a>
    </p>
  </div>
</div>
