<div class="app-container">
  <main class="dashboard-card">
    <header class="glass-header">
      <div class="header-content">
        <h1>Productivity Hub</h1>
        <p>{{ today | date:'EEEE, MMMM d' }}</p>
      </div>
      <div class="stats-pill">
        <span>{{ getCompletedCount() }}/{{ tasks.length }} Completed</span>
      </div>
    </header>

    <div class="creation-area">
      <div class="input-section main-input">
        <input 
          type="text" 
          [(ngModel)]="newTaskTitle" 
          (keyup.enter)="addTask()"
          placeholder="What needs to be done?"
        >
        <button class="add-btn" (click)="addTask()" [disabled]="!newTaskTitle.trim() || isAdding">
          <svg *ngIf="!isAdding" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          <div *ngIf="isAdding" class="btn-spinner"></div>
        </button>
      </div>
      <div class="datetime-wrapper">
        <label>Schedule Task:</label>
        <input type="datetime-local" [(ngModel)]="newTaskDate" class="dt-picker">
      </div>
    </div>

    <nav class="filter-nav">
      <button [class.active]="currentFilter === 'all'" (click)="applyFilter('all')">All</button>
      <button [class.active]="currentFilter === 'todo'" (click)="applyFilter('todo')">To Do</button>
      <button [class.active]="currentFilter === 'in-progress'" (click)="applyFilter('in-progress')">Ongoing</button>
      <button [class.active]="currentFilter === 'done'" (click)="applyFilter('done')">Done</button>
    </nav>

    <section class="task-scroll-area">
      <div *ngIf="isLoading" class="loader">
        <div class="sync-spinner"></div>
        <span>Syncing...</span>
      </div>
      
      <div *ngIf="!isLoading && filteredTasks.length === 0" class="empty-state">
        <p>Your list is clear!</p>
      </div>

      <div *ngFor="let task of filteredTasks" class="task-row" [ngClass]="task.status">
        <div class="task-left">
          <div class="status-bar"></div>
          <div class="content-box">
            <span class="title">{{ task.title }}</span>
            <small class="meta-date" *ngIf="task.taskDate">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              {{ task.taskDate | date:'MMM d, h:mm a' }}
            </small>
          </div>
        </div>
        
        <div class="task-actions">
          <button *ngIf="task.status !== 'in-progress' && task.status !== 'done'" 
                  class="action-btn ongoing-btn" (click)="updateStatus(task, 'in-progress')" title="Start Task">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </button>

          <button *ngIf="task.status !== 'done'" 
                  class="action-btn done-btn" (click)="updateStatus(task, 'done')" title="Mark Done">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          </button>

          <button class="action-btn delete-btn" (click)="deleteTask(task._id)" title="Remove">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
          </button>
        </div>
      </div>
    </section>
  </main>
</div>
